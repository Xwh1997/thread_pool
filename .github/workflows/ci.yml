name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPROJECTA_THREAD_POOL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 30

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          args="-DPROJECTA_THREAD_POOL_BUILD_TESTS=ON"
          if [[ "${{ matrix.sanitizer }}" == "tsan" ]]; then
            args="$args -DPROJECTA_THREAD_POOL_ENABLE_TSAN=ON"
          else
            args="$args -DPROJECTA_THREAD_POOL_ENABLE_ASAN=ON -DPROJECTA_THREAD_POOL_ENABLE_UBSAN=ON"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo $args
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --timeout 30

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install gcovr
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPROJECTA_THREAD_POOL_BUILD_TESTS=ON -DPROJECTA_THREAD_POOL_ENABLE_COVERAGE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --timeout 30
      - run: gcovr --root . --filter 'include/projecta|source' --exclude 'test' --fail-under-line 90 --fail-under-branch 80

  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPROJECTA_THREAD_POOL_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix
      - run: cmake --build build --parallel
      - run: cmake --install build
      - run: cmake -S test/package_consumer -B consumer -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
      - run: cmake --build consumer --parallel
      - run: ctest --test-dir consumer --output-on-failure
